<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync Pop — Multiplayer Timing Game</title>
  <meta name="description" content="A real-time multiplayer reaction game. Click exactly when the server drops the balloon to score!" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

<div id="app">

  <!-- ── Join Screen ─────────────────────────────────────────────────────── -->
  <div id="join-screen" class="screen">
    <div class="join-logo">Sync<span>Pop</span></div>
    <p class="join-sub">A real-time multiplayer timing game</p>
    <form id="join-form">
      <input id="username-input" type="text" placeholder="Enter username" maxlength="32" autocomplete="off" required />
      <p class="join-hint">Use username <strong>admin</strong> to be the Game Master</p>
      <button type="submit" class="btn-join">Join Game</button>
    </form>
  </div>

  <!-- ── Game Screen ─────────────────────────────────────────────────────── -->
  <div id="game-screen" class="screen hidden">

    <!-- Header -->
    <header id="header">
      <div class="logo">Sync<span>Pop</span></div>
      <div id="score-display">Score: <strong id="total-score">0</strong></div>
    </header>

    <main id="game">

      <div id="round-info">Round <span id="round-num">—</span></div>

      <!-- ── GM Panel (hidden for regular players) ── -->
      <section id="gm-panel" class="hidden">
        <h2 class="gm-title">🎮 Game Master</h2>
        <p class="gm-sub">Select a balloon from the prime inventory to start a round</p>
        <div id="gm-inventory" class="gm-grid"></div>
        <div id="gm-status" class="gm-status"></div>
      </section>

      <!-- ── Player Panel (hidden for GM) ── -->
      <section id="player-panel" class="hidden">

        <!-- Status & Countdown -->
        <div id="status-wrap">
          <div id="status-label">Waiting for Game Master…</div>
          <div id="countdown">
            <!-- Gradient def -->
            <svg width="0" height="0" style="position:absolute">
              <defs>
                <linearGradient id="arc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%"   stop-color="#7c5cfc"/>
                  <stop offset="100%" stop-color="#e040fb"/>
                </linearGradient>
              </defs>
            </svg>
            <svg viewBox="0 0 120 120" id="timer-svg">
              <circle class="track" cx="60" cy="60" r="52"/>
              <circle class="fill"  cx="60" cy="60" r="52" id="timer-arc"/>
            </svg>
            <div id="countdown-inner">
              <div id="target-color-dot"></div>
              <span id="countdown-num">—</span>
            </div>
          </div>
        </div>

        <!-- Click Button -->
        <button id="click-btn" class="btn" disabled>
          <span id="btn-label">WAIT</span>
        </button>

        <!-- Result Banner -->
        <div id="result" class="hidden">
          <div id="result-diff"></div>
          <div id="result-points"></div>
        </div>

      </section>

    </main>

    <div id="conn-status" class="disconnected">Connecting…</div>
  </div>

</div><!-- #app -->

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  // ── Constants ──────────────────────────────────────────────────────────────
  const COLOR_HEX = {
    red:    '#ff4d6d',
    blue:   '#4dabf7',
    green:  '#00e5a0',
    yellow: '#ffd94a',
  };
  const CIRCUMFERENCE = 2 * Math.PI * 52;

  // ── DOM ────────────────────────────────────────────────────────────────────
  const $joinScreen     = document.getElementById('join-screen');
  const $gameScreen     = document.getElementById('game-screen');
  const $joinForm       = document.getElementById('join-form');
  const $usernameInput  = document.getElementById('username-input');

  const $gmPanel        = document.getElementById('gm-panel');
  const $gmInventory    = document.getElementById('gm-inventory');
  const $gmStatus       = document.getElementById('gm-status');

  const $playerPanel    = document.getElementById('player-panel');
  const $totalScore     = document.getElementById('total-score');
  const $roundNum       = document.getElementById('round-num');
  const $statusLabel    = document.getElementById('status-label');
  const $countdownNum   = document.getElementById('countdown-num');
  const $targetColorDot = document.getElementById('target-color-dot');
  const $timerArc       = document.getElementById('timer-arc');
  const $clickBtn       = document.getElementById('click-btn');
  const $btnLabel       = document.getElementById('btn-label');
  const $result         = document.getElementById('result');
  const $resultDiff     = document.getElementById('result-diff');
  const $resultPoints   = document.getElementById('result-points');
  const $connStatus     = document.getElementById('conn-status');

  // ── State ──────────────────────────────────────────────────────────────────
  let timeOffset   = 0;
  let isSynced     = false;
  let isGM         = false;
  let hasClicked   = false;
  let animFrame    = null;
  let totalScore   = 0;
  let roundOpen    = false;

  // Per-round close timers (client side)
  let enableTimer  = null;
  let disableTimer = null;

  // ── Socket ─────────────────────────────────────────────────────────────────
  const socket = io();

  socket.on('connect',    () => { setConnStatus(true); runTimeSync(); });
  socket.on('disconnect', () => setConnStatus(false));

  // Initial state on connect (may arrive mid-round)
  socket.on('welcome', (data) => {
    runTimeSync(); // re-sync on reconnect
    if (data.roundId > 0) {
      $roundNum.textContent = data.roundId;
    }
  });

  // Server confirmed our join
  socket.on('joined', (data) => {
    isGM = data.isGM;
    showGameScreen(data.isGM);
    if (data.isGM) {
      renderGMInventory(data.primeInventory);
    }
  });

  // New round triggered by GM
  socket.on('round_start', (data) => {
    $roundNum.textContent = data.roundId;
    hasClicked = false;
    roundOpen  = false;

    if (isGM) {
      renderGMInventory(data.primeInventory);
      setGMStatus(`Round ${data.roundId} started — ${data.color.toUpperCase()} balloon dispensed!`, 'active');
      // Disable all GM buttons during this round
      setGMButtonsEnabled(false);
    } else {
      hideResult();
      applyCountdown(data.primeTime);
    }
  });

  // Round click window closed
  socket.on('round_closed', (data) => {
    roundOpen = false;
    if (isGM) {
      setGMStatus('Round over. Select the next balloon to start a new round.', '');
      setGMButtonsEnabled(true);
    } else {
      disableButton('WAIT');
      setStatus('Round over. Waiting for Game Master…');
      stopCountdown();
    }
  });

  // GM inventory updated (after round closes)
  socket.on('inventory_update', (data) => {
    if (isGM) renderGMInventory(data.primeInventory);
  });

  // Click result — only sent to us
  socket.on('click_result', (data) => {
    totalScore = data.totalScore;
    $totalScore.textContent = totalScore;
    showResult(data.diff, data.points);
    disableButton('✓');
    stopCountdown();
  });

  // ── Time Sync (NTP median of 5 samples) ───────────────────────────────────
  function runTimeSync() {
    isSynced = false;
    const samples = [];
    let done = 0;

    const handler = (sentAt, serverNow) => {
      const rtt    = Date.now() - sentAt;
      const offset = (serverNow + rtt / 2) - Date.now();
      samples.push(offset);

      if (++done < 5) {
        ping();
      } else {
        socket.off('time_sync_reply', handler);
        samples.sort((a, b) => a - b);
        timeOffset = samples[2]; // median
        isSynced   = true;
      }
    };

    socket.on('time_sync_reply', handler);
    ping();
  }

  function ping() { socket.emit('time_sync', Date.now()); }

  // ── Join Form ──────────────────────────────────────────────────────────────
  $joinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $usernameInput.value.trim();
    if (!name) return;
    socket.emit('join', name);
  });

  // ── Game Screen Setup ──────────────────────────────────────────────────────
  function showGameScreen(gm) {
    $joinScreen.classList.add('hidden');
    $gameScreen.classList.remove('hidden');

    if (gm) {
      $gmPanel.classList.remove('hidden');
      $playerPanel.classList.add('hidden');
    } else {
      $playerPanel.classList.remove('hidden');
      $gmPanel.classList.add('hidden');
    }
  }

  // ── GM Inventory UI ────────────────────────────────────────────────────────
  function renderGMInventory(inv) {
    $gmInventory.innerHTML = '';
    for (const color of ['red', 'blue', 'green', 'yellow']) {
      const count = inv[color];
      const card  = document.createElement('button');
      card.className   = `gm-balloon${count === 0 ? ' depleted' : ''}`;
      card.dataset.color = color;
      card.disabled    = count === 0;
      card.style.setProperty('--bcolor', COLOR_HEX[color]);
      card.innerHTML   = `
        <div class="gm-balloon-icon"></div>
        <span class="gm-color-name">${color}</span>
        <span class="gm-count">${count} left</span>
      `;
      card.addEventListener('click', () => onGMDispense(color));
      $gmInventory.appendChild(card);
    }
  }

  function onGMDispense(color) {
    if (roundOpen) return; // already a round in flight (belt-and-suspenders)
    socket.emit('gm_dispense', color);
  }

  function setGMStatus(text, cls) {
    $gmStatus.textContent = text;
    $gmStatus.className   = `gm-status ${cls}`;
  }

  function setGMButtonsEnabled(enabled) {
    $gmInventory.querySelectorAll('.gm-balloon:not(.depleted)').forEach(btn => {
      btn.disabled = !enabled;
    });
  }

  // ── Player: Countdown ──────────────────────────────────────────────────────
  function applyCountdown(serverPrimeTime) {
    // Convert server absolute time → local time
    const localPrimeTime = serverPrimeTime - timeOffset;
    const msUntilPrime   = localPrimeTime - Date.now();

    disableButton('WAIT');
    setStatus('Get ready…');
    startCountdown(msUntilPrime);

    if (enableTimer)  clearTimeout(enableTimer);
    if (disableTimer) clearTimeout(disableTimer);

    enableTimer = setTimeout(() => {
      if (!hasClicked) { enableButton('CLICK!'); setStatus('CLICK NOW!'); }
      roundOpen = true;
    }, Math.max(0, msUntilPrime - 500));

    disableTimer = setTimeout(() => {
      if (!hasClicked) disableButton('TOO LATE');
      roundOpen = false;
      setStatus('Missed it. Waiting for next round…');
      stopCountdown();
    }, msUntilPrime + 2000);
  }

  function startCountdown(msTotal) {
    stopCountdown();
    if (msTotal <= 0) return;
    const start = Date.now();
    $timerArc.style.strokeDasharray  = CIRCUMFERENCE;
    $timerArc.style.strokeDashoffset = 0;

    const tick = () => {
      const remaining = Math.max(0, msTotal - (Date.now() - start));
      $countdownNum.textContent       = (remaining / 1000).toFixed(1);
      $timerArc.style.strokeDashoffset = CIRCUMFERENCE * (1 - remaining / msTotal);
      if (remaining > 0) animFrame = requestAnimationFrame(tick);
    };
    animFrame = requestAnimationFrame(tick);
  }

  function stopCountdown() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    $countdownNum.textContent = '—';
    $timerArc.style.strokeDashoffset = CIRCUMFERENCE;
  }

  // ── Player: Click ─────────────────────────────────────────────────────────
  $clickBtn.addEventListener('click', () => {
    if ($clickBtn.disabled || hasClicked) return;
    hasClicked = true;
    socket.emit('click');
  });

  // ── UI Helpers ────────────────────────────────────────────────────────────
  function enableButton(label) {
    $clickBtn.disabled = false;
    $clickBtn.classList.add('active');
    $btnLabel.textContent = label;
  }

  function disableButton(label) {
    $clickBtn.disabled = true;
    $clickBtn.classList.remove('active');
    $btnLabel.textContent = label;
  }

  function setStatus(text) { $statusLabel.textContent = text; }

  function showResult(diffMs, points) {
    $result.classList.remove('hidden');
    $resultDiff.textContent   = `Off by ${diffMs}ms (${(diffMs/1000).toFixed(3)}s)`;
    $resultPoints.textContent = `+${points} pts`;
    $result.className = points >= 8 ? 'result great' : points >= 4 ? 'result ok' : 'result miss';
  }

  function hideResult() {
    $result.className = 'hidden';
  }

  function setConnStatus(connected) {
    $connStatus.textContent = connected ? 'Connected' : 'Disconnected — reconnecting…';
    $connStatus.className   = connected ? 'connected'  : 'disconnected';
  }

})();
</script>
</body>
</html>
